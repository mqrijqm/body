      - heading "Naš pristup zdravlju je da se naprave nevjerovatni ali održivi rezultati, poslije kojih se osjećaš snažno i na spravi i van nje." [level=2] [ref=f24e23]
      - generic [ref=f24e24]:
        - paragraph [ref=f24e25]: Sa godinama iskustva u podučavanju i privilegijom da smo radile sa preko sto različitih klijentica, naučile smo šta to pravi veliku promjenu i trajne rezultate u tijelu. Nikad nam ne prestaje biti zadivljujuće koliko su naša tijela zapravo sposobna — uz pravi trening možeš postići bilo šta.
