      - generic [ref=f27e13]:
        - paragraph [ref=f27e14]: Sa godinama iskustva u podučavanju i privilegijom da smo radile sa preko sto različitih klijentica, naučile smo šta to pravi veliku promjenu i trajne rezultate u tijelu. Nikad nam ne prestaje biti zadivljujuće koliko su naša tijela zapravo sposobna — uz pravi trening možeš postići bilo šta.
