      - heading "Naša priča" [level=3] [ref=f27e19]
      - paragraph [ref=f27e20]: Strast prema pilatesu počela je prije više od osam godina, u radu u klinici kao sportski terapeut. Vidjeti iz prve ruke koliko brzo se klijenti oporavljaju od povreda kroz pilates bio je razlog da se i same obučimo za instruktorice. Nikad se nismo osvrnule.
      - paragraph [ref=f27e21]: Nakon što smo se zaglavile u krugu pretreniranosti visokim intenzitetom — iscrpljene, bez rezultata koje smo željele — konačno smo našle metod koji nismo samo zavoljele, nego nas je doveo do mjesta gdje smo osjetile pravu snagu centra i vezu tijela i uma. Mnoge naše klijentice su krenule iz istog obrasca, pa nam je misija da proširimo rezultate koje dosljedna pilates praksa može donijeti.
      - paragraph [ref=f27e22]: Naši časovi spajaju preko hiljadu sati podučavanja i učenja u metod koji oblikuje, izdužuje i daje tonus. Sa fokusom na dah, da se veza produbi i da te preobrazi u najbolju verziju tvog već nevjerovatnog sebe.
