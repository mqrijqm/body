  - generic [ref=f28e11]:
    - heading "Naš pristup zdravlju je da se naprave nevjerovatni ali održivi rezultati, poslije kojih se osjećaš snažno i na spravi i van nje." [level=2] [ref=f28e12]
    - generic [ref=f28e13]:
      - paragraph [ref=f28e14]: Sa godinama iskustva u podučavanju i privilegijom da smo radile sa preko sto različitih klijentica, naučile smo šta to pravi veliku promjenu i trajne rezultate u tijelu. Nikad nam ne prestaje biti zadivljujuće koliko su naša tijela zapravo sposobna — uz pravi trening možeš postići bilo šta.
      - link "Virtuelni studio" [ref=f28e15] [cursor=pointer]:
