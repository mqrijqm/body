  - generic [ref=f14e19]:
    - heading "My approach to health is about creating incredible yet sustainable results which leave you feeling empowered on and off the mat." [level=2] [ref=f14e21]
    - generic [ref=f14e22]:
      - paragraph [ref=f14e23]: With years of teaching experience as well as having the privilege to have taught over 100 different clients, I have learnt what it is that creates huge change and lasting results in bodies. It never fails to amaze me how amazing our bodies truly are and with the right workout, you can achieve anything.
      - link "Virtual Studio" [ref=f14e24] [cursor=pointer]:
        - /url: /virtual-studio
  - generic [ref=f14e27]:
    - heading "My Story" [level=3] [ref=f14e28]
    - paragraph [ref=f14e29]: My passion for pilates started over eight years ago as I was working within clinic as a sports therapist being able to see first hand how fast my clients recovered from injury through Pilates led me to train as an instructor myself. I’ve never looked back! After being stuck in a cycle of overtraining with high impact workouts leaving me exhausted without seeing the results I wanted, I had finally found a method that I not only adored but got me to a place where I felt true core strength and connection in my body and mind. A lot of my clients started in a similar pattern and I have made it my mission to spread the life changing results that a consistent pilates practice can offer.My classes combine over a thousand hours of teaching and learning to deliver a method that sculpts, lengthens and tones. With focus on the breath to connect deeper and transform you into the best version of your already incredible self.
    - link "Get in touch" [ref=f14e30] [cursor=pointer]:
      - /url: /contact
  - generic [ref=f14e33]:
